<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>SiswaTech | Kusuma AI Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap");
      html,
      body {
        max-width: 100% !important;
        overflow-x: hidden !important;
        font-family: "Plus Jakarta Sans", sans-serif;
        height: 100%;
        background-color: #020617;
      }
      /* 🟩 TEMA HIJAU GRADASI MATRIX TECH (FIXED PERCENTAGE) */
      .gradient-text {
        background: linear-gradient(
          135deg,
          #34d399 0%,
          #ffffff 60%,
          #059669 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .glass-input {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(52, 211, 153, 0.15);
      }
      .glass-modal {
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(52, 211, 153, 0.2);
      }
      code {
        font-family: "JetBrains Mono", monospace;
      }
    </style>
  </head>
  <body
    class="bg-slate-950 text-slate-200 h-full flex flex-col overflow-hidden selection:bg-emerald-500 selection:text-slate-950"
  >
    <!-- POPUP INPUT NAMA (MODAL) -->
    <div
      id="nameModal"
      class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md transition-all duration-500"
    >
      <div
        class="glass-modal w-full max-w-md p-6 rounded-3xl shadow-2xl text-center scale-100 transition-transform"
      >
        <div
          class="w-12 h-12 mx-auto rounded-2xl bg-gradient-to-tr from-emerald-500 via-teal-500 to-emerald-700 flex items-center justify-center text-white mb-4 shadow-lg"
        >
          <img
            src="logo-nexa.png"
            alt="Fingerprint"
            class="w-full h-full object-cover rounded-2xl"
          />
        </div>
        <h3 class="text-lg font-bold text-white mb-1">
          Kenalan dengan <span class="gradient-text">Nexa</span>
        </h3>
        <p class="text-xs text-slate-400 mb-5">
          Masukkan nama panggilanmu untuk memulai enkripsi obrolan
        </p>

        <div class="space-y-3">
          <input
            type="text"
            id="nicknameInput"
            placeholder="Nama panggilanmu..."
            autocomplete="off"
            class="w-full p-3.5 bg-slate-900 border border-slate-800 rounded-2xl outline-none text-sm text-center text-white focus:border-emerald-500 transition-all placeholder-slate-600"
          />
          <button
            id="startChatBtn"
            class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:opacity-90 text-white font-semibold rounded-2xl text-sm transition-all shadow-md active:scale-[0.98] cursor-pointer"
          >
            Mulai Obrolan <i class="fas fa-arrow-right ml-1 text-xs"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- NAVBAR ATAS -->
    <header
      class="w-full z-50 border-b border-slate-900 bg-transparent shrink-0"
    >
      <div
        class="max-w-4xl mx-auto px-4 md:px-6 h-16 flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
            <a href="../index.html" class="inline-flex items-center shrink-0">
              <img 
                src="../gambar/logo-header.png" 
                alt="KusumaWeb Logo" 
                class="h-7 md:h-16 w-auto object-contain contrast-150 brightness-110 hover:scale-105 transition-transform duration-200"
              />
            </a>
          <span
            class="text-[10px] font-mono px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"
            >V2.5 PRO</span
          >
        </div>
        <div class="flex items-center gap-4">
          <a
            href="../index.html"
            class="text-xs md:text-sm font-medium text-slate-400 hover:text-emerald-400 transition-colors flex items-center gap-1.5"
          >
            <i class="fas fa-home text-xs"></i> Home
          </a>
        </div>
      </div>
    </header>

    <!-- AREA ALIRAN CHAT -->
    <main
      id="chatBox"
      class="flex-1 overflow-y-auto w-full max-w-3xl mx-auto px-4 md:px-6 py-8 space-y-8 scrollbar-thin scrollbar-thumb-slate-900 border-none outline-none"
    >
      <!-- Pesan selamat datang disuntikkan dinamis via script.js -->
    </main>

    <!-- AREA INPUT CHAT BAWAH DENGAN FILE UPLOAD -->
    <footer class="w-full shrink-0 bg-transparent pb-6 pt-2">
      <div class="max-w-3xl mx-auto px-4 md:px-6">
        <div
          class="glass-input rounded-2xl shadow-lg relative flex items-end p-2 transition-all duration-300 focus-within:ring-1 focus-within:ring-emerald-500/50"
        >
          <!-- Tombol Upload File Tersembunyi -->
          <input
            type="file"
            id="fileInput"
            accept="image/*,application/pdf,text/*"
            class="hidden"
          />

          <!-- Ikon Klip Kertas (FIX HIJAU) -->
          <button
            id="uploadBtn"
            class="h-9 w-9 text-slate-500 hover:text-emerald-400 flex items-center justify-center rounded-xl transition-colors cursor-pointer shrink-0 mb-1"
          >
            <i class="fas fa-paperclip text-sm"></i>
          </button>

          <!-- Input Teks Utama -->
          <input
            type="text"
            id="userInput"
            placeholder="Tanyakan sesuatu"
            class="w-full py-3 pl-2 pr-14 bg-transparent text-sm md:text-base text-white outline-none placeholder-slate-500 resize-none"
          />

          <div class="absolute right-3 bottom-3">
            <button
              id="sendBtn"
              class="h-9 w-9 bg-gradient-to-r from-emerald-600 to-teal-600 hover:opacity-90 text-white rounded-xl flex items-center justify-center shadow-md transition-all duration-200 hover:scale-105 active:scale-95 cursor-pointer"
            >
              <i class="fas fa-arrow-up text-xs"></i>
            </button>
          </div>
        </div>

        <!-- Indikator nama file saat berhasil dipilih -->
        <div
          id="filePreview"
          class="hidden text-[11px] font-mono text-emerald-400 mt-2 flex items-center gap-2 max-w-3xl mx-auto px-2"
        >
          <i class="fas fa-file-image"></i> <span id="fileName">image.png</span>
          <button id="cancelFileBtn" class="text-red-400 hover:text-red-500">
            <i class="fas fa-times"></i>
          </button>
        </div>

        <p class="text-[10px] text-center text-slate-600 mt-2 font-mono">
          Nexa adalah AI yang dapat melakukan kesalahan. <br />
          Harap periksa kembali respons.
        </p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
